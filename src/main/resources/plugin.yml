name: KASTARA-PlayerKiller
version: 1.2.0
main: id.kastara.playerkiller.KASTARAPlayerKiller
api-version: '1.21'
authors: [KASTARA]
description: Three-stage Player Head progression integrated with KASTARALives.
depend: [KASTARALives]
commands:
  playerkiller:
    description: KASTARA PlayerKiller administration
    usage: /playerkiller reload | /playerkiller givehead <player>
  recipe:
    description: Lihat resep Player/Killer
    usage: /recipe
  giveplayerhead:
    description: Berikan custom Player Head untuk testing
    usage: /giveplayerhead <player>
permissions:
  kastaraplayerkiller.admin:
    default: op
