# Lore item Player Head
player-head-lore:
  - "&7Drop dari membunuh player lain."
  - "&7Gunakan sebagai bahan crafting tahap Player/Killer."
  - "&7Letakkan hasil craft di tanah dengan klik kanan."
  - "&7Lihat kepala tersebut lalu tekan &fShift + Klik Kanan&7."
  - "&cEfek dan progres hilang jika kamu mati / kehilangan life."

stage-1-name: "&bSharp as a Diamond"
stage-1-lore:
  - "&7Membuka efek permanen Strength I."
  - "&7Letakkan kepala di tanah dengan klik kanan."
  - "&7Lihat kepala lalu tekan &fShift + Klik Kanan&7."
  - "&cEfek dan progres hilang jika mati / kehilangan life."
stage-2-name: "&bHard as a Diamond"
stage-2-lore:
  - "&7Mengaktifkan Strength I + Resistance I permanen."
  - "&7Wajib aktifkan Sharp as a Diamond terlebih dahulu."
  - "&7Letakkan kepala, lihat, lalu &fShift + Klik Kanan&7."
  - "&cEfek dan progres hilang jika mati / kehilangan life."
stage-3-name: "&cPlayer/Killer"
stage-3-lore:
  - "&7Efek final: Strength II + Resistance II permanen."
  - "&7Wajib aktifkan dua tahap sebelumnya."
  - "&7Letakkan kepala, lihat, lalu &fShift + Klik Kanan&7."
  - "&cEfek dan progres hilang jika mati / kehilangan life."

