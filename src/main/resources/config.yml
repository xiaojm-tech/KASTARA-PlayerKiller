# KASTARA-PlayerKiller v1.1.0
# Texture dapat diisi URL textures.minecraft.net/texture/<hash> atau Base64 property textures.
textures:
  player-head: ""
  stage-1: "" # Bloody Diamond
  stage-2: "" # Diamond Sprinkle
  stage-3: "" # Very Bloody

recipes:
  stage-1:
    shape: ["DSD", "DHD", "DDD"]
    ingredients: {D: DIAMOND, S: DIAMOND_SWORD, H: PLAYER_HEAD}
  stage-2:
    shape: ["DSD", "DHD", "DCD"]
    ingredients: {D: DIAMOND, S: DIAMOND_SWORD, C: DIAMOND_CHESTPLATE, H: PLAYER_HEAD}
  stage-3:
    # H=Player Head, N=Netherite Ingot, S=Diamond Sword,
    # C=Diamond Chestplate, D=Diamond
    shape: ["HNH", "SHC", "DDD"]
    ingredients: {H: PLAYER_HEAD, N: NETHERITE_INGOT, S: DIAMOND_SWORD, C: DIAMOND_CHESTPLATE, D: DIAMOND}

effects:
  # Integer maksimum = durasi sangat panjang; plugin akan refresh sebelum habis.
  duration-ticks: 2147483647
  refresh-below-ticks: 80
  activation-sound: ITEM_NETHERITE_UPGRADE_SMITHING_TEMPLATE_USE
  # Animasi kepala naik sekitar 2 blok, diakhiri ledakan partikel ungu (diatur di kode).
  stage-2-shield:
    scale: 0.45
    height: 0.62
    radius: 0.62
    rotation-speed: 0.00135
  stage-3-nether-star:
    scale: 0.50

final-title:
  title: "&d&lare you a player or a killer??"
  subtitle: "&c&lLimit Breaker"

